name: Yahoo News Scraper

on:
  workflow_dispatch: # 手動実行またはGASからのトリガー用

permissions:
  actions: read    # 過去のワークフロー実行履歴を読むため
  contents: read   # checkout 等で必要な場合

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 【重要】サーバー全体を日本時間設定にする
      TZ: Asia/Tokyo
      # 【重要】Node.js 24への強制移行対応
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
      # 環境変数
      SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
      GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      GOOGLE_API_KEY_1: ${{ secrets.GOOGLE_API_KEY_1 }}
      GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
      GOOGLE_API_KEY_3: ${{ secrets.GOOGLE_API_KEY_3 }}
      GOOGLE_API_KEY_4: ${{ secrets.GOOGLE_API_KEY_4 }}
      GOOGLE_API_KEY_5: ${{ secrets.GOOGLE_API_KEY_5 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # JST の現在「時」（HH）と日付を取得
      - name: Get current JST hour
        id: time
        run: |
          echo "jst_hour=$(date +'%H')" >> "$GITHUB_OUTPUT"
          echo "jst_date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "Current JST time: $(date +'%Y-%m-%d %H:%M:%S')"

      # 同じ JST 時・日付に success な workflow_dispatch 実行があればスキップフラグを立てる
      - name: Check previous successful run in same JST hour
        id: check_previous
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # jq が必要なのでインストール（既に入っていてもOK）
          sudo apt-get update -y
          sudo apt-get install -y jq

          CURRENT_JST_HOUR="${{ steps.time.outputs.jst_hour }}"
          CURRENT_JST_DATE="${{ steps.time.outputs.jst_date }}"
          REPO="${{ github.repository }}"

          # この Workflow のファイル名 (.github/workflows/main.yml)
          WORKFLOW_FILE="main.yml"

          echo "Current JST date: $CURRENT_JST_DATE, hour: $CURRENT_JST_HOUR"

          # 過去の workflow_dispatch & completed を取得（最大30件程度見れば十分）
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?event=workflow_dispatch&status=completed&per_page=30" \
               > runs.json

          FOUND_SUCCESS=0

          # workflow_runs が無い場合でも落ちないように // [] を追加
          runs=$(jq -c '.workflow_runs // [] | .[] | {created_at, conclusion}' runs.json)

          # while をサブシェルにしない形で回す
          while IFS= read -r row; do
            CREATED_AT=$(echo "$row" | jq -r '.created_at')   # UTC (例: 2024-09-01T20:13:00Z)
            CONCLUSION=$(echo "$row" | jq -r '.conclusion')   # success / failure / cancelled 等

            # スキップ判定に使うのは success のみ
            if [ "$CONCLUSION" != "success" ]; then
              continue
            fi

            # UTC → JST に変換
            TS=$(date -d "$CREATED_AT" +%s)
            RUN_JST_HOUR=$(TZ=Asia/Tokyo date -d "@$TS" +'%H')
            RUN_JST_DATE=$(TZ=Asia/Tokyo date -d "@$TS" +'%Y-%m-%d')

            echo "Found run: created_at(UTC)=$CREATED_AT, JST=$RUN_JST_DATE $RUN_JST_HOUR:00, conclusion=$CONCLUSION"

            # 日付と時が一致するかどうか
            if [ "$RUN_JST_DATE" = "$CURRENT_JST_DATE" ] && [ "$RUN_JST_HOUR" = "$CURRENT_JST_HOUR" ]; then
              FOUND_SUCCESS=1
              break
            fi
          done <<< "$runs"

          if [ "$FOUND_SUCCESS" -eq 1 ]; then
            echo "Same JST hour already has a successful run. Skipping this execution."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No successful run in the same JST hour. Proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # main.py はいつでも実行（ただし同時間に成功済みならスキップ）
      - name: Run Main Scraper (Latest News & Comments)
        if: steps.check_previous.outputs.skip != 'true'
        run: |
          python -u main.py

      # analyzer_past.py は JST 05:00〜05:59 かつ「同時間に成功済みがない場合だけ」動かす
      - name: Run Past Analyzer (Past 4 Days)
        if: steps.check_previous.outputs.skip != 'true' && steps.time.outputs.jst_hour == '08'
        run: |
          python -u analyzer_past.py

      - name: Cleanup
        if: always()
        run: |
          echo "Process finished."
          exit 0
